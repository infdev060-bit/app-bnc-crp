    <script>
      // Cleanly intercept Vite dev server WebSocket disconnects without unhandled rejections
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason)) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
          event.preventDefault();
          console.debug('[Vite HMR] Connexion WebSocket du serveur Vite interrompue (interceptée sans rejet non géré).');
        }
      });
    </script>
